name: QuestHub Android dependency courier

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'questhub-courier-trigger.txt'

jobs:
  courier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.11.1
        shell: bash
        run: |
          mkdir -p "$HOME/questhub-toolchain"
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/questhub-toolchain"

      - name: Warm exact public dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qh/app/src/main/java/com/example/qh /tmp/qh/app/src/main/res/values /tmp/qh/app/src/test/java/com/example/qh
          cat > /tmp/qh/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = 'QuestHubCourier'
          include ':app'
          EOF
          cat > /tmp/qh/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > /tmp/qh/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > /tmp/qh/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.qh'
              compileSdk 35
              defaultConfig { applicationId 'com.example.qh'; minSdk 29; targetSdk 35; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              testOptions { unitTests.returnDefaultValues = true }
          }
          dependencies {
              implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
              implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
              implementation 'org.conscrypt:conscrypt-android:2.5.3'
              testImplementation 'junit:junit:4.13.2'
          }
          EOF
          cat > /tmp/qh/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > /tmp/qh/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > /tmp/qh/app/src/main/java/com/example/qh/MainActivity.java <<'EOF'
          package com.example.qh; public final class MainActivity extends android.app.Activity {}
          EOF
          cat > /tmp/qh/app/src/test/java/com/example/qh/SmokeTest.java <<'EOF'
          package com.example.qh; import org.junit.Test; public final class SmokeTest { @Test public void ok() {} }
          EOF
          cd /tmp/qh
          "$HOME/questhub-toolchain/gradle-8.11.1/bin/gradle" --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Package offline toolchain
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/questhub-offline-toolchain"
          mkdir -p "$OUT/android-sdk/platforms" "$OUT/android-sdk/build-tools" "$OUT/gradle-home"
          cp -a "$ANDROID_SDK_ROOT/platforms/android-35" "$OUT/android-sdk/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/35.0.0" "$OUT/android-sdk/build-tools/"
          cp -a "$ANDROID_SDK_ROOT/platform-tools" "$OUT/android-sdk/"
          cp -a "$HOME/questhub-toolchain/gradle-8.11.1" "$OUT/"
          cp -a "$HOME/.gradle/caches" "$OUT/gradle-home/"
          cp -a "$HOME/.gradle/native" "$OUT/gradle-home/" 2>/dev/null || true
          printf 'AGP=8.7.3\nGRADLE=8.11.1\nCOMPILE_SDK=35\nBUILD_TOOLS=35.0.0\n' > "$OUT/manifest.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/questhub-offline-toolchain.tgz" questhub-offline-toolchain
          sha256sum "$RUNNER_TEMP/questhub-offline-toolchain.tgz" > "$RUNNER_TEMP/questhub-offline-toolchain.tgz.sha256"

      - name: Upload offline toolchain
        uses: actions/upload-artifact@v4
        with:
          name: questhub-offline-android-toolchain
          path: |
            ${{ runner.temp }}/questhub-offline-toolchain.tgz
            ${{ runner.temp }}/questhub-offline-toolchain.tgz.sha256
          retention-days: 1
