name: QuestReader Scan Demo Build

on:
  push:
    branches:
      - questreader-scan-demo-build
    paths:
      - 'questreader-scan-demo/**'
      - '.github/workflows/questreader-scan-demo-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p questreader-scan-demo :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p questreader-demo-output
          cp questreader-scan-demo/app/build/outputs/apk/debug/app-debug.apk questreader-demo-output/QuestReader-Scan-Demo-v0.1.apk
          sha256sum questreader-demo-output/QuestReader-Scan-Demo-v0.1.apk | tee questreader-demo-output/QuestReader-Scan-Demo-v0.1.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestReader-Scan-Demo-v0.1
          path: questreader-demo-output/
          retention-days: 14

      - name: Commit APK to build branch
        run: |
          git config user.name "QuestReader Build Bot"
          git config user.email "questreader-build@users.noreply.github.com"
          git add -f questreader-demo-output/QuestReader-Scan-Demo-v0.1.apk questreader-demo-output/QuestReader-Scan-Demo-v0.1.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Build QuestReader Scan Demo v0.1 [skip ci]"
            git push origin HEAD:questreader-scan-demo-build
          fi
